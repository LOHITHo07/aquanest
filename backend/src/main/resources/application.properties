server.port=${PORT:8080}
spring.application.name=aquanest-backend

# System Mode: SIMULATION or LIVE
data.mode=${DATA_MODE:SIMULATION}

# MQTT Configuration
mqtt.broker.url=${MQTT_BROKER:tcp://broker.hivemq.com:1883}
mqtt.client.id=${MQTT_CLIENT_ID:aquanest-backend-server}
mqtt.username=${MQTT_USERNAME:}
mqtt.password=${MQTT_PASSWORD:}
mqtt.topic.tank=aquanest/tank/readings
mqtt.topic.pump.status=aquanest/pump/status
mqtt.topic.pump.control=aquanest/pump/control
mqtt.topic.pressure=aquanest/pressure/readings
mqtt.topic.house.flow=aquanest/house/+/flow
mqtt.topic.alerts=aquanest/alerts

# Firebase Configuration
firebase.project.id=${FIREBASE_PROJECT_ID:aquanest-iot-firebase}
firebase.client.email=${FIREBASE_CLIENT_EMAIL:}
firebase.private.key=${FIREBASE_PRIVATE_KEY:}
firebase.credentials.path=${FIREBASE_CREDENTIALS_PATH:}

# Water Management System Defaults
aquanest.tank.capacity-litres=4000.0
aquanest.tank.low-threshold-percent=20.0
aquanest.tank.full-threshold-percent=90.0
aquanest.billing.water-tariff-per-litre=0.10
aquanest.billing.fixed-monthly-charge=200.0
aquanest.flow.default-calibration-factor=450.0
aquanest.leakage.tolerance-percent=5.0
aquanest.pressure.nominal-bar=2.8
aquanest.pressure.leak-threshold-bar=1.8

# CORS
cors.allowed-origins=*
